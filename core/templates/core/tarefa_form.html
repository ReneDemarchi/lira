{% extends 'base.html' %}
{% block title %}{% if tarefa %}Editar{% else %}Nova{% endif %} tarefa · LIRA{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
  <nav class="mb-2"><a href="{% url 'projeto' projeto.pk %}">← {{ projeto.nome }}</a></nav>
  <h1 class="h3 mb-3">{% if tarefa %}Editar tarefa{% else %}Nova tarefa{% endif %}</h1>
  <form method="post">{% csrf_token %}
    {% include '_form.html' %}
    <button class="btn btn-primary">Salvar</button>
    <a class="btn btn-link" href="{% if tarefa %}{% url 'tarefa' projeto.pk tarefa.pk %}{% else %}{% url 'projeto' projeto.pk %}{% endif %}">Cancelar</a>
  </form>
</div></div>
{% endblock %}
