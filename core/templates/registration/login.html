{% extends '_auth_card.html' %}
{% block title %}Entrar · LIRA{% endblock %}
{% block card %}
<h1 class="h4 mb-3">Entrar</h1>
<form method="post">{% csrf_token %}
  {% include '_form.html' %}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary w-100">Entrar</button>
</form>
<p class="mt-3 mb-0 text-center">Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
{% endblock %}
