<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LIRA{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand bg-dark" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">LIRA</a>
    {% if user.is_authenticated %}
      <div class="navbar-nav ms-auto align-items-center gap-2">
        <span class="navbar-text">{{ user }}</span>
        <a class="nav-link" href="{% url 'trocar_senha' %}">Trocar senha</a>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}
          <button class="btn btn-sm btn-outline-light">Sair</button>
        </form>
      </div>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% for m in messages %}
    <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %}">{{ m }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
